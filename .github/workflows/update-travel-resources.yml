name: Update 12Go Resource Links

on:
  push:
    paths:
      - '.github/workflows/update-travel-resources.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update 12Go links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          files = sorted(Path(".").glob("*post-travel-resources.html"))
          updated_files = []

          old_pattern = re.compile(
              r'<a\s+href="https://12go\.asia/\?z=9193611"'
              r'\s+target="_blank"'
              r'\s+rel="noopener sponsored">'
              r'12Go system</a>',
              re.I
          )

          replacement = (
              '<a href="https://booking.closerlives.com/en" '
              'target="_blank" '
              'rel="noopener sponsored">12Go system</a>'
          )

          for path in files:
              content = path.read_text(encoding="utf-8")
              updated_content, count = old_pattern.subn(
                  replacement,
                  content
              )

              if count:
                  path.write_text(
                      updated_content,
                      encoding="utf-8"
                  )
                  updated_files.append((str(path), count))

          print(
              f"Scanned {len(files)} "
              "post-travel-resources files."
          )

          print(
              f"Updated {len(updated_files)} files."
          )

          for filename, count in updated_files:
              print(
                  f"Updated: {filename} "
                  f"({count} link replacement(s))"
              )

          if not updated_files:
              print(
                  "ERROR: No matching 12Go links were found."
              )
              sys.exit(1)
          PY

      - name: Commit updates
        run: |
          git config user.name "Closer Lives Automation"
          git config user.email "actions@users.noreply.github.com"

          git add -- '*post-travel-resources.html'

          if git diff --cached --quiet; then
            echo "ERROR: No HTML changes to commit."
            exit 1
          fi

          git commit -m "Update 12Go resource links"
          git push
