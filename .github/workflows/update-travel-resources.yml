name: Fix All Travel Resource Auto Height

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-travel-resources.yml'
      - '.github/travel-resize-trigger'

permissions:
  contents: write

jobs:
  fix-travel-resource-auto-height:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace all country Travel auto-height scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = sorted(Path('.').glob('*-blog-post-travel-resources.html'))

          if not files:
              raise SystemExit('No country Travel Resources files found.')

          exact_script = '''<!-- Auto height script for Wix -->
<script>
(function () {
    const wrap = document.querySelector(".wrap");
    if (!wrap) return;

    let resizeTimer = null;
    let lastHeight = 0;

    function postHeight() {
        const height = Math.ceil(
            wrap.getBoundingClientRect().height
        );

        if (height === lastHeight) return;
        lastHeight = height;

        parent.postMessage(
            {
                type: "CL_RESIZE",
                height: height
            },
            "*"
        );
    }

    function sendHeight() {
        requestAnimationFrame(function () {
            requestAnimationFrame(postHeight);
        });
    }

    function settleHeight() {
        clearTimeout(resizeTimer);

        resizeTimer = setTimeout(function () {
            sendHeight();
        }, 50);
    }

    window.addEventListener("load", function () {
        sendHeight();
        setTimeout(sendHeight, 100);
    });

    document.querySelectorAll("details").forEach(function (details) {
        details.addEventListener("toggle", function () {
            settleHeight();
        });
    });

    const resizeObserver = new ResizeObserver(function () {
        settleHeight();
    });

    resizeObserver.observe(wrap);

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
            sendHeight();
        });
    }
})();
</script>'''

          pattern = re.compile(
              r'(?:<!-- CL_TRAVEL_AUTO_HEIGHT_START -->\s*)?'
              r'<!-- Auto height script for Wix -->\s*'
              r'<script>.*?</script>'
              r'(?:\s*<!-- CL_TRAVEL_AUTO_HEIGHT_END -->)?',
              flags=re.S | re.I
          )

          changed = []

          for path in files:
              html = path.read_text(encoding='utf-8')

              if pattern.search(html):
                  new_html = pattern.sub(exact_script, html, count=1)
              else:
                  body = re.search(r'</body\s*>', html, flags=re.I)
                  if not body:
                      raise SystemExit(f'Missing </body> in {path}')
                  new_html = html[:body.start()].rstrip() + '\n\n' + exact_script + '\n\n' + html[body.start():]

              if new_html != html:
                  path.write_text(new_html, encoding='utf-8')
                  changed.append(str(path))

          print(f'Country Travel files found: {len(files)}')
          print(f'Files changed: {len(changed)}')
          for path in changed:
              print('UPDATED:', path)
          PY

      - name: Commit and push changes
        shell: bash
        run: |
          if git diff --quiet -- '*-blog-post-travel-resources.html'; then
            echo 'All Travel resource files already match the working pattern.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*-blog-post-travel-resources.html'
          git commit -m 'Apply working auto-height pattern to all Travel resources'
          git push
