name: Fix All Travel Resource Resize

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-travel-resource-resize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch all country travel resource boxes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Targets every country-specific Travel Resources file.
          # Deliberately excludes the generic travel-resources.html file.
          files = sorted(Path(".").glob("*-blog-post-travel-resources.html"))

          if not files:
              raise SystemExit("No *-blog-post-travel-resources.html files found.")

          marker_start = "<!-- CL_RESIZE_SYNC_START -->"
          marker_end = "<!-- CL_RESIZE_SYNC_END -->"

          resize_block = '''<!-- CL_RESIZE_SYNC_START -->
          <script>
          (function () {
            function reportHeight() {
              var height = Math.max(
                document.body ? document.body.scrollHeight : 0,
                document.documentElement ? document.documentElement.scrollHeight : 0,
                document.body ? document.body.offsetHeight : 0,
                document.documentElement ? document.documentElement.offsetHeight : 0
              );

              window.parent.postMessage(
                {
                  type: "CL_RESIZE",
                  height: height
                },
                "*"
              );
            }

            function scheduleHeightReports() {
              requestAnimationFrame(function () {
                requestAnimationFrame(reportHeight);
              });
              setTimeout(reportHeight, 50);
              setTimeout(reportHeight, 150);
              setTimeout(reportHeight, 350);
            }

            window.addEventListener("load", scheduleHeightReports);
            window.addEventListener("resize", scheduleHeightReports);

            document.addEventListener("click", function () {
              scheduleHeightReports();
            });

            document.addEventListener("toggle", function () {
              scheduleHeightReports();
            }, true);

            if ("MutationObserver" in window) {
              var observer = new MutationObserver(function () {
                scheduleHeightReports();
              });

              observer.observe(document.documentElement, {
                attributes: true,
                childList: true,
                subtree: true
              });
            }

            scheduleHeightReports();
          })();
          </script>
          <!-- CL_RESIZE_SYNC_END -->'''

          changed = []
          unchanged = []

          for path in files:
              html = path.read_text(encoding="utf-8")
              original = html

              if marker_start in html and marker_end in html:
                  pattern = re.compile(
                      re.escape(marker_start) + r".*?" + re.escape(marker_end),
                      flags=re.S
                  )
                  html = pattern.sub(resize_block, html)
              else:
                  closing_body = re.search(r"</body\\s*>", html, flags=re.I)
                  if closing_body:
                      idx = closing_body.start()
                      html = html[:idx].rstrip() + "\\n\\n" + resize_block + "\\n" + html[idx:]
                  else:
                      html = html.rstrip() + "\\n\\n" + resize_block + "\\n"

              if html != original:
                  path.write_text(html, encoding="utf-8")
                  changed.append(str(path))
              else:
                  unchanged.append(str(path))

          print(f"Travel resource files found: {len(files)}")
          print(f"Changed: {len(changed)}")
          for item in changed:
              print(f"  UPDATED: {item}")

          print(f"Already current: {len(unchanged)}")
          for item in unchanged:
              print(f"  OK: {item}")
          PY

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*-blog-post-travel-resources.html'
          git commit -m "Fix resize reporting for all travel resource boxes"
          git push
