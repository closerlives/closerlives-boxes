name: Fix All Travel Resource Auto Height

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-travel-resource-auto-height:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace Travel auto-height scripts with proven Social Media pattern
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = sorted(Path(".").glob("*-blog-post-travel-resources.html"))

          if not files:
              raise SystemExit("No *-blog-post-travel-resources.html files found.")

          marker_start = "<!-- CL_TRAVEL_AUTO_HEIGHT_START -->"
          marker_end = "<!-- CL_TRAVEL_AUTO_HEIGHT_END -->"

          auto_height_block = '''<!-- CL_TRAVEL_AUTO_HEIGHT_START -->
          <!-- Auto height script for Wix -->
          <script>
          (function () {
              const wrap = document.querySelector(".wrap");
              if (!wrap) return;

              let resizeTimer = null;
              let lastHeight = 0;

              function postHeight() {
                  const height = Math.ceil(
                      wrap.getBoundingClientRect().height
                  );

                  if (height === lastHeight) return;
                  lastHeight = height;

                  parent.postMessage(
                      {
                          type: "CL_RESIZE",
                          height: height
                      },
                      "*"
                  );
              }

              function sendHeight() {
                  requestAnimationFrame(function () {
                      requestAnimationFrame(postHeight);
                  });
              }

              function settleHeight() {
                  clearTimeout(resizeTimer);

                  resizeTimer = setTimeout(function () {
                      sendHeight();
                  }, 50);
              }

              window.addEventListener("load", function () {
                  sendHeight();
                  setTimeout(sendHeight, 100);
              });

              document.querySelectorAll("details").forEach(function (details) {
                  details.addEventListener("toggle", function () {
                      settleHeight();
                  });
              });

              const resizeObserver = new ResizeObserver(function () {
                  settleHeight();
              });

              resizeObserver.observe(wrap);

              if (document.fonts && document.fonts.ready) {
                  document.fonts.ready.then(function () {
                      sendHeight();
                  });
              }
          })();
          </script>
          <!-- CL_TRAVEL_AUTO_HEIGHT_END -->'''

          changed = []
          unchanged = []

          for path in files:
              html = path.read_text(encoding="utf-8")
              original = html

              # Remove any previously managed Travel auto-height block.
              managed_patterns = [
                  re.compile(
                      r'<!-- CL_RESIZE_SYNC_START -->.*?<!-- CL_RESIZE_SYNC_END -->',
                      flags=re.S
                  ),
                  re.compile(
                      r'<!-- CL_TRAVEL_AUTO_HEIGHT_START -->.*?<!-- CL_TRAVEL_AUTO_HEIGHT_END -->',
                      flags=re.S
                  )
              ]

              for pattern in managed_patterns:
                  html = pattern.sub("", html)

              # Remove an older existing "Auto height script for Wix" block
              # if present, so there is only one resize system.
              old_auto = re.compile(
                  r'<!-- Auto height script for Wix -->\s*<script>.*?</script>',
                  flags=re.S | re.I
              )
              html = old_auto.sub("", html)

              # Remove other standalone scripts that post CL_RESIZE, to avoid
              # duplicate or conflicting height calculations.
              scripts = re.findall(r'<script\b[^>]*>.*?</script>', html, flags=re.S | re.I)
              for script in scripts:
                  if 'CL_RESIZE' in script and 'parent.postMessage' in script:
                      html = html.replace(script, "")

              closing_body = re.search(r"</body\s*>", html, flags=re.I)

              if closing_body:
                  idx = closing_body.start()
                  html = (
                      html[:idx].rstrip()
                      + "\n\n"
                      + auto_height_block
                      + "\n\n"
                      + html[idx:]
                  )
              else:
                  html = html.rstrip() + "\n\n" + auto_height_block + "\n"

              if html != original:
                  path.write_text(html, encoding="utf-8")
                  changed.append(str(path))
              else:
                  unchanged.append(str(path))

          print(f"Travel resource files found: {len(files)}")
          print(f"Updated: {len(changed)}")
          for item in changed:
              print(f"  UPDATED: {item}")

          print(f"Already current: {len(unchanged)}")
          for item in unchanged:
              print(f"  OK: {item}")
          PY

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- '*-blog-post-travel-resources.html'
          git commit -m "Match Travel resource auto-height to Social Media"
          git push
