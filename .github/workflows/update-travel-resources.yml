name: Improve Travel Box Resizing

on:
  push:
    paths:
      - '.github/workflows/update-travel-resources.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Improve resize handling
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          files = sorted(Path(".").glob("*post-travel-resources.html"))
          updated_files = []

          new_script = r'''<!-- Auto height script for Wix -->
          <script>
            (function () {
              function postHeight() {
                var height = Math.max(
                  document.documentElement.scrollHeight,
                  document.body.scrollHeight
                );

                parent.postMessage(
                  {
                    type: "CL_RESIZE",
                    height: height
                  },
                  "*"
                );
              }

              function sendHeight() {
                requestAnimationFrame(function () {
                  requestAnimationFrame(postHeight);
                });
              }

              window.addEventListener("load", function () {
                sendHeight();
                setTimeout(sendHeight, 100);
                setTimeout(sendHeight, 300);
              });

              document.querySelectorAll("details").forEach(function (detail) {
                detail.addEventListener("toggle", function () {
                  sendHeight();

                  // Recheck once layout/transitions have completed.
                  setTimeout(sendHeight, 100);
                  setTimeout(sendHeight, 300);
                  setTimeout(sendHeight, 600);
                });
              });

              var resizeObserver = new ResizeObserver(function () {
                sendHeight();
              });

              resizeObserver.observe(document.documentElement);

              // Fallback for delayed embeds, maps, fonts and other content.
              setInterval(sendHeight, 1500);
            })();
          </script>'''

          pattern = re.compile(
              r'<!-- Auto height script for Wix -->\s*'
              r'<script>.*?type:\s*"CL_RESIZE".*?</script>',
              re.S
          )

          for path in files:
              content = path.read_text(encoding="utf-8")
              updated_content, count = pattern.subn(
                  new_script,
                  content,
                  count=1
              )

              if count:
                  path.write_text(
                      updated_content,
                      encoding="utf-8"
                  )
                  updated_files.append(str(path))

          print(
              f"Scanned {len(files)} post-travel-resources files."
          )

          print(
              f"Updated {len(updated_files)} files."
          )

          for filename in updated_files:
              print(f"Updated: {filename}")

          if not updated_files:
              print(
                  "ERROR: No existing CL_RESIZE scripts were matched."
              )
              sys.exit(1)
          PY

      - name: Commit updates
        run: |
          git config user.name "Closer Lives Automation"
          git config user.email "actions@users.noreply.github.com"

          git add -- '*post-travel-resources.html'

          if git diff --cached --quiet; then
            echo "ERROR: No HTML changes to commit."
            exit 1
          fi

          git commit -m "Improve travel resource box resizing"
          git push
