name: Update 12Go Resource Links

on:
  push:
    paths:
      - '.github/workflows/update-travel-resources.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update 12Go links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = sorted(Path(".").glob("*post-travel-resources.html"))

          updated_files = []

          for path in files:
              content = path.read_text(encoding="utf-8")
              original = content

              def update_12go_link(match):
                  attrs = match.group(1)
                  link_text = match.group(2)

                  # Remove any existing href and rel attributes.
                  attrs = re.sub(
                      r'\s+href="[^"]*"',
                      '',
                      attrs,
                      flags=re.I
                  )

                  attrs = re.sub(
                      r'\s+rel="[^"]*"',
                      '',
                      attrs,
                      flags=re.I
                  )

                  return (
                      '<a'
                      + attrs
                      + ' href="https://booking.closerlives.com/en"'
                      + ' rel="noopener sponsored">'
                      + link_text
                      + '</a>'
                  )

              content = re.sub(
                  r'<a\b([^>]*)>(\s*Powered by 12Go system\s*)</a>',
                  update_12go_link,
                  content,
                  flags=re.I
              )

              if content != original:
                  path.write_text(content, encoding="utf-8")
                  updated_files.append(str(path))

          print(f"Scanned {len(files)} post-travel-resources files.")
          print(f"Updated {len(updated_files)} files.")

          for filename in updated_files:
              print(f"Updated: {filename}")
          PY

      - name: Commit updates
        run: |
          git config user.name "Closer Lives Automation"
          git config user.email "actions@users.noreply.github.com"

          git add -- '*post-travel-resources.html'

          if git diff --cached --quiet; then
            echo "No 12Go links required updating."
          else
            git commit -m "Update 12Go resource links"
            git push
          fi
