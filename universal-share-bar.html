<script>
(function () {

  const allowedHostnames = new Set([
    "closerlives.com",
    "www.closerlives.com"
  ]);

  let currentPostUrl = null;


  /* -------------------------
     VALIDATE URL
  ------------------------- */

  function cleanUrl(value) {

    if (!value) return null;

    try {

      const url = new URL(value);

      if (!allowedHostnames.has(
        url.hostname.toLowerCase()
      )) {
        return null;
      }

      url.hash = "";
      url.search = "";

      return url.href.replace(/\/$/, "");

    } catch (error) {

      return null;

    }
  }


  /* -------------------------
     CREATE POST TITLE
  ------------------------- */

  function titleFromUrl(postUrl) {

    try {

      let slug =
        new URL(postUrl)
          .pathname
          .split("/")
          .filter(Boolean)
          .pop() ||
          "Closer Lives Post";

      slug = decodeURIComponent(slug);

      return slug
        .replace(/[-_]+/g, " ")
        .replace(
          /\b\w/g,
          character =>
            character.toUpperCase()
        )
        .trim();

    } catch (error) {

      return "Closer Lives Post";

    }
  }


  /* -------------------------
     BUILD SHARE LINKS
  ------------------------- */

  function buildShareLinks(postUrl) {

    const cleanedUrl =
      cleanUrl(postUrl);

    if (!cleanedUrl) {
      return;
    }

    currentPostUrl = cleanedUrl;

    const encodedUrl =
      encodeURIComponent(cleanedUrl);

    const encodedSubject =
      encodeURIComponent(
        titleFromUrl(cleanedUrl)
      );

    const encodedBody =
      encodeURIComponent(
        `I thought you might enjoy this post:\n${cleanedUrl}`
      );


    document.getElementById("fbShare").href =
      `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`;

    document.getElementById("liShare").href =
      `https://www.linkedin.com/shareArticle?mini=true&url=${encodedUrl}`;

    document.getElementById("gmailShare").href =
      `https://mail.google.com/mail/?view=cm&fs=1&su=${encodedSubject}&body=${encodedBody}`;

    document.getElementById("pinShare").href =
      `https://pinterest.com/pin/create/button/?url=${encodedUrl}`;

    document.getElementById("xShare").href =
      `https://twitter.com/intent/tweet?url=${encodedUrl}`;

    document.getElementById("outlookShare").href =
      `https://outlook.office.com/mail/deeplink/compose?subject=${encodedSubject}&body=${encodedBody}`;

  }


  /* -------------------------
     RECEIVE URL FROM WIX
  ------------------------- */

  window.addEventListener(
    "message",
    function (event) {

      if (
        event.data &&
        event.data.type === "SET_POST_URL" &&
        event.data.url
      ) {

        buildShareLinks(
          event.data.url
        );

      }

    }
  );


  /* -------------------------
     TELL WIX WE'RE READY
  ------------------------- */

  window.parent.postMessage(
    {
      type: "READY"
    },
    "*"
  );

})();
</script>
